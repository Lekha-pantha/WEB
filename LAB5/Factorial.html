<!DOCTYPE html>
<html>

<body>

    <h3>Factorial Calculator</h3>

    <input id="n" type="number" placeholder="Enter number">
    <button onclick="calc()">Find</button>

    <p id="out"></p>

    <script>
        const fact = (n) => {
            if (n == 0 || n == 1) return 1;
            return n * fact(n - 1);
        };

        const calc = () => {
            let n = +document.getElementById("n").value;
            document.getElementById("out").innerText = fact(n);
        };
    </script>

</body>

</html>
