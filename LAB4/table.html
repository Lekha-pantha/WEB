<!DOCTYPE html>
<html>

<head>
    <title>Table & Pattern</title>
</head>

<body>

    <h2>Table of 12</h2>

    <script>
        for (let i = 1; i <= 10; i++) {
            document.write("12 x " + i + " = " + (12 * i) + "<br>");
        }
    </script>

    <br>

    <h2>Star Pattern</h2>

    <script>
        for (let i = 1; i <= 5; i += 2) {
            for (let j = 1; j <= i; j++) {
                document.write("*");
            }
            document.write("<br>");
        }
    </script>

</body>

</html>
